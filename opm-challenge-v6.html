<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio One Punch Man</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --surface: #161616; --card: #1e1e1e; --border: #2a2a2a;
      --accent: #c8f135; --accent-dim: rgba(200,241,53,0.10);
      --done: #4ade80; --done-dim: rgba(74,222,128,0.10);
      --text: #f0f0f0; --muted: #555; --radius: 10px;
      --m1: #c8f135; --m2: #38bdf8; --m3: #f97316;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; padding: 0 0 80px; }

    /* NAV CATEGORIAS */
    nav { position: sticky; top: 0; z-index: 100; background: rgba(13,13,13,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; gap: 4px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    .nav-btn { flex-shrink: 0; background: transparent; border: 1.5px solid var(--border); border-radius: 99px; color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; font-weight: 600; padding: 6px 14px; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
    .nav-btn.locked { opacity: 0.45; }

    /* NAV MESES */
    .month-nav { display: flex; gap: 6px; padding: 12px 16px 0; max-width: 820px; margin: 0 auto; }
    .month-btn { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.75rem; font-weight: 700; padding: 8px 4px; cursor: pointer; transition: all 0.18s; text-align: center; }
    .month-btn:hover:not(.locked-month) { border-color: var(--accent); color: var(--accent); }
    .month-btn.active-m1 { border-color: var(--m1); color: var(--m1); background: rgba(200,241,53,0.08); }
    .month-btn.active-m2 { border-color: var(--m2); color: var(--m2); background: rgba(56,189,248,0.08); }
    .month-btn.active-m3 { border-color: var(--m3); color: var(--m3); background: rgba(249,115,22,0.08); }
    .month-btn.locked-month { opacity: 0.35; cursor: default; }
    .month-label { font-size: 0.6rem; color: var(--muted); display: block; margin-top: 2px; font-family: 'Space Grotesk', sans-serif; font-weight: 400; }

    /* HEADER */
    header { text-align: center; padding: 28px 20px 22px; }
    .eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    h1 span { color: var(--accent); }
    .subtitle { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }

    /* SECTION */
    .section { display: none; padding: 0 16px; max-width: 820px; margin: 0 auto; }
    .section.active { display: block; }

    /* TOPBAR */
    .section-topbar { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 16px; flex-wrap: wrap; gap: 10px; }
    .topbar-info { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.8; }
    .topbar-info strong { color: var(--accent); font-size: 1.05rem; }
    .btn-adjust { background: transparent; border: 1.5px solid var(--border); border-radius: 99px; color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.78rem; font-weight: 600; padding: 6px 14px; cursor: pointer; transition: all 0.18s; }
    .btn-adjust:hover { border-color: var(--accent); color: var(--accent); }

    /* CHANGELOG */
    .changelog { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .changelog-title { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .changelog-entry { background: var(--surface); border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; padding: 8px 12px; font-size: 0.8rem; line-height: 1.5; }
    .changelog-entry .cl-meta { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--accent); margin-bottom: 3px; }
    .changelog-entry .cl-reason { color: var(--muted); }

    /* CONFIG BAR */
    .config-bar { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .config-bar label { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .config-bar input { background: var(--card); border: 1.5px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 1rem; padding: 8px 12px; width: 100px; transition: border-color 0.18s; }
    .config-bar input:focus { outline: none; border-color: var(--accent); }
    .config-bar button { background: var(--accent); border: none; border-radius: 6px; color: #0d0d0d; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 9px 18px; cursor: pointer; }

    /* PROGRESS */
    .progress-wrap { margin-bottom: 20px; }
    .progress-meta { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .progress-meta strong { color: var(--done); }
    .bar-bg { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
    .bar-m1 { background: linear-gradient(90deg, var(--done), var(--m1)); }
    .bar-m2 { background: linear-gradient(90deg, var(--done), var(--m2)); }
    .bar-m3 { background: linear-gradient(90deg, var(--done), var(--m3)); }

    /* STATS */
    .stats { display: flex; gap: 10px; margin-bottom: 20px; }
    .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
    .stat-val { font-family: 'Space Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 4px; }

    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 7px; }
    .card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 8px 9px; cursor: pointer; user-select: none; transition: border-color 0.18s, background 0.18s, transform 0.1s; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
    .card:hover:not(.done) { border-color: var(--accent); background: var(--accent-dim); }
    .card:active { transform: scale(0.96); }
    .card.done { border-color: var(--done); background: var(--done-dim); }
    .card-date { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .card.done .card-date { color: var(--done); }
    .day-num { font-size: 0.62rem; color: var(--muted); }
    .check-ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.18s; }
    .card.done .check-ring { border-color: var(--done); background: rgba(74,222,128,0.18); }
    .checkmark { opacity: 0; transform: scale(0.4); transition: opacity 0.2s, transform 0.2s; }
    .card.done .checkmark { opacity: 1; transform: scale(1); }
    .card-reps { font-size: 0.68rem; font-weight: 600; color: var(--muted); }
    .card.done .card-reps { color: var(--done); }
    .note-btn { position: absolute; top: 4px; right: 4px; background: none; border: none; cursor: pointer; font-size: 11px; opacity: 0.3; transition: opacity 0.18s; padding: 2px; line-height: 1; }
    .card:hover .note-btn, .note-btn.has-note { opacity: 1; }

    /* LOCKED */
    .locked-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 50px 20px; text-align: center; color: var(--muted); }
    .lock-icon { font-size: 2.2rem; }
    .locked-overlay p { font-size: 0.88rem; line-height: 1.6; max-width: 300px; }

    /* MONTH LOCKED */
    .month-locked { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 20px; text-align: center; color: var(--muted); }
    .month-locked p { font-size: 0.85rem; line-height: 1.6; max-width: 280px; }

    /* MODAL */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 22px; width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .modal-title { font-weight: 700; font-size: 1rem; }
    .modal-sub { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 3px; }
    .modal-close { background: var(--card); border: 1px solid var(--border); border-radius: 50%; color: var(--muted); cursor: pointer; font-size: 0.9rem; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .modal-field { display: flex; flex-direction: column; gap: 6px; }
    .modal-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .modal-label span { color: #f87171; font-size: 0.7rem; }
    .modal input, .modal textarea { background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.92rem; padding: 10px 12px; transition: border-color 0.18s; }
    .modal input { font-family: 'Space Mono', monospace; font-size: 1.1rem; width: 130px; }
    .modal textarea { resize: vertical; min-height: 90px; line-height: 1.6; width: 100%; }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
    .modal textarea::placeholder, .modal input::placeholder { color: var(--muted); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-primary { background: var(--accent); border: none; border-radius: 7px; color: #0d0d0d; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 9px 18px; cursor: pointer; }
    .btn-secondary { background: transparent; border: 1.5px solid var(--border); border-radius: 7px; color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; padding: 9px 14px; cursor: pointer; }
    .btn-secondary:hover { border-color: #f87171; color: #f87171; }

    @media (max-width: 480px) { .grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); } .stats { gap: 6px; } .stat-val { font-size: 1rem; } }
  </style>
</head>
<body>

<nav id="nav"></nav>

<!-- Modal: Nota -->
<div class="modal-backdrop" id="modal-note">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="note-title">Nota</div><div class="modal-sub" id="note-sub"></div></div>
      <button class="modal-close" id="note-close">✕</button>
    </div>
    <div class="modal-field">
      <div class="modal-label">Nota do dia</div>
      <textarea id="note-text" placeholder="Como correu? Dificuldades, sensações, motivação..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="note-delete">Apagar</button>
      <button class="btn-primary" id="note-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Ajustar valor -->
<div class="modal-backdrop" id="modal-adjust">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="adjust-title">Ajustar valor</div><div class="modal-sub" id="adjust-sub"></div></div>
      <button class="modal-close" id="adjust-close">✕</button>
    </div>
    <div class="modal-field">
      <div class="modal-label">Novo valor</div>
      <input type="number" id="adjust-val" min="1" placeholder="ex: 30">
    </div>
    <div class="modal-field">
      <div class="modal-label">Motivo <span>(obrigatório)</span></div>
      <textarea id="adjust-reason" placeholder="Ex: foco na respiração e ritmo mais lento..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="adjust-cancel">Cancelar</button>
      <button class="btn-primary" id="adjust-save">Confirmar alteração</button>
    </div>
  </div>
</div>

<header>
  <p class="eyebrow">Desafio · One Punch Man</p>
  <h1>90 Dias de<br><span id="header-title">Flexões</span></h1>
  <p class="subtitle" id="header-sub"></p>
</header>

<div id="month-nav-wrap"></div>
<div id="sections"></div>

<script>
const PT_MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const PT_DAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

// Mês 1 começa a 17 Jun 2026
// Mês 2 começa dia 31 (17 Jul)
// Mês 3 começa dia 61 (16 Ago)
const MONTH_STARTS = [
  new Date(2026, 5, 17),
  new Date(2026, 6, 17),
  new Date(2026, 7, 16)
];
const MONTH_LABELS = ['Mês 1', 'Mês 2', 'Mês 3'];
const MONTH_COLORS = ['m1', 'm2', 'm3'];
const DAYS_PER_MONTH = 30;
const TOTAL_MONTHS = 3;

const CATEGORIES = [
  { id:'flexoes',    label:'Flexões',    emoji:'💪', unit:'reps', max:100, defaultReps:40,  preDone:5, configurable:false },
  { id:'squats',     label:'Squats',     emoji:'🦵', unit:'reps', max:100, defaultReps:null, preDone:0, configurable:true  },
  { id:'abdominais', label:'Abdominais', emoji:'🔥', unit:'reps', max:100, defaultReps:null, preDone:0, configurable:true  },
  { id:'corrida',    label:'Corrida',    emoji:'🏃', unit:'km',   max:5,   defaultReps:null, preDone:0, configurable:true  }
];

const KEY = 'opm_v7';

function defaultMonthData(cat, monthIdx) {
  const preDone = monthIdx === 0 ? cat.preDone : 0;
  return {
    reps: monthIdx === 0 ? cat.defaultReps : null,
    unlocked: monthIdx === 0 ? !cat.configurable : false,
    days: Array.from({length: DAYS_PER_MONTH}, (_, i) =>
      i < preDone ? (cat.defaultReps || null) : null
    ),
    notes: {},
    changelog: []
  };
}

function defaultState() {
  const s = {};
  CATEGORIES.forEach(cat => {
    s[cat.id] = {
      months: Array.from({length: TOTAL_MONTHS}, (_, mi) => defaultMonthData(cat, mi))
    };
  });
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // migrate v6 → v7
      CATEGORIES.forEach(cat => {
        if (!s[cat.id]) { s[cat.id] = defaultState()[cat.id]; return; }
        if (!s[cat.id].months) {
          // old flat structure → wrap as month 0
          const old = s[cat.id];
          s[cat.id] = { months: Array.from({length: TOTAL_MONTHS}, (_, mi) => {
            if (mi === 0) return {
              reps: old.reps,
              unlocked: old.unlocked !== undefined ? old.unlocked : !cat.configurable,
              days: old.days || Array(DAYS_PER_MONTH).fill(null),
              notes: old.notes || {},
              changelog: old.changelog || []
            };
            return defaultMonthData(cat, mi);
          })};
        }
        s[cat.id].months.forEach(m => {
          if (!m.notes) m.notes = {};
          if (!m.changelog) m.changelog = [];
          // migrate boolean days
          if (m.days && typeof m.days[0] === 'boolean') {
            m.days = m.days.map(d => d ? (m.reps || 40) : null);
          }
        });
      });
      return s;
    }
  } catch(e) {}
  return defaultState();
}

function saveState() { localStorage.setItem(KEY, JSON.stringify(state)); }

let state = loadState();
let activeTab   = 'flexoes';
let activeMonth = 0; // 0,1,2

function dayDate(monthIdx, dayIdx) {
  const d = new Date(MONTH_STARTS[monthIdx]);
  d.setDate(d.getDate() + dayIdx);
  return d;
}
function fmtDate(d) { return PT_DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + PT_MONTHS[d.getMonth()]; }
function fmtNow()   { const d = new Date(); return fmtDate(d) + ' ' + d.getFullYear(); }

// ── MODALS ────────────────────────────────────────────────
let noteCtx   = { catId:null, monthIdx:null, dayIdx:null };
let adjustCtx = { catId:null, monthIdx:null };

function openNote(catId, monthIdx, dayIdx, e) {
  e.stopPropagation();
  noteCtx = { catId, monthIdx, dayIdx };
  const cat = CATEGORIES.find(c => c.id === catId);
  const m   = state[catId].months[monthIdx];
  document.getElementById('note-title').textContent = cat.emoji + ' ' + cat.label + ' — ' + MONTH_LABELS[monthIdx] + ' Dia ' + (dayIdx+1);
  document.getElementById('note-sub').textContent   = fmtDate(dayDate(monthIdx, dayIdx));
  document.getElementById('note-text').value        = (m.notes || {})[dayIdx] || '';
  document.getElementById('modal-note').classList.add('open');
  setTimeout(() => document.getElementById('note-text').focus(), 50);
}
function closeNote() { document.getElementById('modal-note').classList.remove('open'); }
function saveNote() {
  const val = document.getElementById('note-text').value.trim();
  const m   = state[noteCtx.catId].months[noteCtx.monthIdx];
  if (!m.notes) m.notes = {};
  if (val) m.notes[noteCtx.dayIdx] = val;
  else delete m.notes[noteCtx.dayIdx];
  saveState(); closeNote(); render();
}
function deleteNote() {
  const m = state[noteCtx.catId].months[noteCtx.monthIdx];
  if (m.notes) delete m.notes[noteCtx.dayIdx];
  saveState(); closeNote(); render();
}

function openAdjust(catId, monthIdx) {
  adjustCtx = { catId, monthIdx };
  const cat = CATEGORIES.find(c => c.id === catId);
  const m   = state[catId].months[monthIdx];
  document.getElementById('adjust-title').textContent = cat.emoji + ' Ajustar ' + cat.label + ' — ' + MONTH_LABELS[monthIdx];
  document.getElementById('adjust-sub').textContent   = 'Valor atual: ' + (m.reps || '—') + ' ' + cat.unit + '  ·  Objetivo: ' + cat.max + ' ' + cat.unit;
  document.getElementById('adjust-val').value         = m.reps || '';
  document.getElementById('adjust-reason').value      = '';
  document.getElementById('modal-adjust').classList.add('open');
  setTimeout(() => document.getElementById('adjust-val').focus(), 50);
}
function closeAdjust() { document.getElementById('modal-adjust').classList.remove('open'); }
function saveAdjust() {
  const val    = parseInt(document.getElementById('adjust-val').value);
  const reason = document.getElementById('adjust-reason').value.trim();
  if (!val || val < 1) { alert('Introduz um valor válido.'); return; }
  if (!reason)         { alert('Escreve o motivo — fica guardado no teu historial!'); return; }
  const { catId, monthIdx } = adjustCtx;
  const cat = CATEGORIES.find(c => c.id === catId);
  const m   = state[catId].months[monthIdx];
  m.changelog.push({ date: fmtNow(), from: m.reps, to: val, unit: cat.unit, reason });
  m.reps = val;
  saveState(); closeAdjust(); render();
}

document.getElementById('note-close').onclick  = closeNote;
document.getElementById('note-save').onclick   = saveNote;
document.getElementById('note-delete').onclick = deleteNote;
document.getElementById('modal-note').onclick  = e => { if (e.target === document.getElementById('modal-note')) closeNote(); };
document.getElementById('adjust-close').onclick  = closeAdjust;
document.getElementById('adjust-cancel').onclick = closeAdjust;
document.getElementById('adjust-save').onclick   = saveAdjust;
document.getElementById('modal-adjust').onclick  = e => { if (e.target === document.getElementById('modal-adjust')) closeAdjust(); };

// ── RENDER ────────────────────────────────────────────────
function render() {
  renderNav();
  renderMonthNav();
  renderSection();
  renderHeader();
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const m0     = state[cat.id].months[0];
    const locked = !m0.unlocked;
    const btn    = document.createElement('button');
    btn.className = 'nav-btn' + (cat.id === activeTab ? ' active' : '') + (locked ? ' locked' : '');
    btn.textContent = cat.emoji + ' ' + cat.label;
    btn.onclick = () => { activeTab = cat.id; activeMonth = 0; render(); };
    nav.appendChild(btn);
  });
}

function renderMonthNav() {
  const wrap = document.getElementById('month-nav-wrap');
  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'month-nav';

  const catMonths = state[activeTab].months;

  MONTH_LABELS.forEach((label, mi) => {
    const m      = catMonths[mi];
    const locked = !m.unlocked;
    const btn    = document.createElement('button');
    const color  = MONTH_COLORS[mi];
    const done   = m.days.filter(d => d !== null).length;
    btn.className = 'month-btn' + (locked ? ' locked-month' : '') + (activeMonth === mi && !locked ? ' active-' + color : '');
    btn.innerHTML = label + '<span class="month-label">' + (locked ? '🔒' : done + '/30') + '</span>';
    btn.onclick = () => {
      if (locked) return;
      activeMonth = mi;
      render();
    };
    div.appendChild(btn);
  });
  wrap.appendChild(div);
}

function renderHeader() {
  const cat = CATEGORIES.find(c => c.id === activeTab);
  const m   = state[activeTab].months[activeMonth];
  document.getElementById('header-title').textContent = cat.label;
  const start = MONTH_STARTS[activeMonth];
  document.getElementById('header-sub').textContent =
    MONTH_LABELS[activeMonth] + ' · ' +
    (m.reps ? m.reps + ' ' + cat.unit + '/dia' : 'define o teu início') +
    ' · ' + fmtDate(start) + ' ' + start.getFullYear();
}

function renderSection() {
  const container = document.getElementById('sections');
  container.innerHTML = '';

  const cat = CATEGORIES.find(c => c.id === activeTab);
  const sec = document.createElement('div');
  sec.className = 'section active';

  const m0 = state[activeTab].months[0];

  // Category not unlocked at all
  if (!m0.unlocked) {
    sec.innerHTML = `
      <div class="locked-overlay">
        <div class="lock-icon">🔒</div>
        <p>Ainda não começaste os <strong>${cat.label}</strong>.<br>Define o teu valor inicial para desbloquear.</p>
        <div class="config-bar" style="justify-content:center">
          <label>${cat.unit === 'km' ? 'Distância inicial (km)' : 'Reps iniciais'}
            <input type="number" id="unlock-inp" min="1" max="${cat.max}" placeholder="ex: ${Math.round(cat.max*0.4)}">
          </label>
          <button id="btn-unlock">Começar ${cat.label}</button>
        </div>
      </div>`;
    container.appendChild(sec);
    document.getElementById('btn-unlock').onclick = () => {
      const val = parseInt(document.getElementById('unlock-inp').value);
      if (!val || val < 1) { alert('Introduz um valor válido para começar.'); return; }
      state[activeTab].months[0].unlocked = true;
      state[activeTab].months[0].reps     = val;
      state[activeTab].months[0].days     = Array(DAYS_PER_MONTH).fill(null);
      saveState(); render();
    };
    return;
  }

  const m = state[activeTab].months[activeMonth];

  // Month not yet unlocked
  if (!m.unlocked) {
    const prevM    = state[activeTab].months[activeMonth - 1];
    const prevDone = prevM.days.filter(d => d !== null).length;
    const canStart = prevDone === DAYS_PER_MONTH;
    sec.innerHTML = `
      <div class="month-locked">
        <div class="lock-icon">📅</div>
        <p>${canStart
          ? 'Parabéns por completares o ' + MONTH_LABELS[activeMonth-1] + '!<br>Define o teu valor para o ' + MONTH_LABELS[activeMonth] + '.'
          : 'Completa todos os dias do ' + MONTH_LABELS[activeMonth-1] + ' para desbloquear o ' + MONTH_LABELS[activeMonth] + '.<br>Faltam ' + (DAYS_PER_MONTH - prevDone) + ' dias.'
        }</p>
        ${canStart ? `
        <div class="config-bar" style="justify-content:center">
          <label>${cat.unit === 'km' ? 'Distância (km)' : 'Reps'}
            <input type="number" id="month-unlock-inp" min="1" max="${cat.max}" placeholder="ex: ${prevM.reps || ''}">
          </label>
          <button id="btn-month-unlock">Começar ${MONTH_LABELS[activeMonth]}</button>
        </div>` : ''}
      </div>`;
    container.appendChild(sec);
    if (canStart) {
      document.getElementById('btn-month-unlock').onclick = () => {
        const val = parseInt(document.getElementById('month-unlock-inp').value);
        if (!val || val < 1) { alert('Introduz um valor válido.'); return; }
        state[activeTab].months[activeMonth].unlocked = true;
        state[activeTab].months[activeMonth].reps     = val;
        saveState(); render();
      };
    }
    return;
  }

  // Normal month view
  const done  = m.days.filter(d => d !== null).length;
  const pct   = (done / DAYS_PER_MONTH * 100).toFixed(1);
  const total = m.days.reduce((s, v) => s + (v || 0), 0);
  const color = MONTH_COLORS[activeMonth];

  const changelogHTML = m.changelog && m.changelog.length
    ? `<div class="changelog">
        <div class="changelog-title">📋 Historial de alterações</div>
        ${m.changelog.map(e => `
          <div class="changelog-entry">
            <div class="cl-meta">${e.date} &nbsp;·&nbsp; ${e.from} → ${e.to} ${e.unit}</div>
            <div class="cl-reason">${e.reason}</div>
          </div>`).join('')}
      </div>` : '';

  sec.innerHTML = `
    <div class="section-topbar">
      <div class="topbar-info">
        Valor atual: <strong>${m.reps || '—'} ${cat.unit}</strong><br>
        Objetivo: ${cat.max} ${cat.unit}
      </div>
      <button class="btn-adjust" id="btn-adj">⚙️ Ajustar valor</button>
    </div>
    ${changelogHTML}
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>${cat.label} · ${MONTH_LABELS[activeMonth]}</span>
        <strong>${done} / ${DAYS_PER_MONTH} dias</strong>
      </div>
      <div class="bar-bg"><div class="bar-fill bar-${color}" style="width:${pct}%"></div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${done}</div><div class="stat-label">Dias feitos</div></div>
      <div class="stat"><div class="stat-val">${total > 0 ? total.toLocaleString('pt-PT') : '—'}</div><div class="stat-label">Total ${cat.unit}</div></div>
      <div class="stat"><div class="stat-val">${DAYS_PER_MONTH - done}</div><div class="stat-label">Restantes</div></div>
    </div>
    <div class="grid" id="main-grid"></div>`;

  container.appendChild(sec);
  document.getElementById('btn-adj').onclick = () => openAdjust(activeTab, activeMonth);

  const grid = document.getElementById('main-grid');
  m.days.forEach((dayVal, i) => {
    const isDone   = dayVal !== null;
    const hasNote  = !!(m.notes && m.notes[i]);
    const repsLabel = isDone
      ? (dayVal + ' ' + cat.unit)
      : (m.reps ? m.reps + ' ' + cat.unit : '— ' + cat.unit);
    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <button class="note-btn ${hasNote ? 'has-note' : ''}" title="Nota">${hasNote ? '📝' : '✏️'}</button>
      <span class="card-date">${fmtDate(dayDate(activeMonth, i))}</span>
      <span class="day-num">Dia ${i+1}</span>
      <div class="check-ring"><span class="checkmark">✓</span></div>
      <span class="card-reps">${repsLabel}</span>`;
    card.querySelector('.note-btn').onclick = (e) => openNote(activeTab, activeMonth, i, e);
    card.onclick = () => {
      state[activeTab].months[activeMonth].days[i] = isDone ? null : (m.reps || 0);
      saveState(); render();
    };
    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
